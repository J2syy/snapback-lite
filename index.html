<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
<title>SNAPBACK Photo Booth</title>

<style>
/* ===== VSCO / SNAPCHAT IMMERSIVE AESTHETIC ===== */
:root {
  --text-main: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.6);
  --glass-bg: rgba(20, 20, 20, 0.4);
  --glass-border: rgba(255, 255, 255, 0.15);
  --accent: #ffffff;
  --radius-lg: 32px;
  --radius-pill: 100px;
}

* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
  -webkit-tap-highlight-color: transparent;
  font-smooth: always;
  -webkit-font-smoothing: antialiased;
}

body {
  margin: 0;
  background: #000000;
  color: var(--text-main);
  /* Strictly lock to viewport - NO SCROLLING */
  height: 100vh;
  height: 100dvh; 
  width: 100vw;
  overflow: hidden; 
  position: relative;
}

/* ===== FULL SCREEN BACKGROUND CAMERA ===== */
.bg-video {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  object-fit: cover;
  z-index: 0;
}

/* Gradient overlay to ensure UI is always readable over bright cameras */
.bg-gradient {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 15%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.7) 100%);
  z-index: 1;
  pointer-events: none;
}

.bg-filter-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  z-index: 2;
  pointer-events: none;
  transition: background 0.3s ease;
}

/* ===== FLOATING HEADER ===== */
header {
  position: absolute;
  top: env(safe-area-inset-top, 12px);
  left: 0; right: 0;
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}

.brand h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.5px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}

.tagline {
  font-size: 10px;
  font-weight: 600;
  color: rgba(255,255,255,0.8);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-top: 2px;
  text-shadow: 0 1px 5px rgba(0,0,0,0.3);
}

.admin-btn {
  background: transparent;
  border: none;
  color: white;
  padding: 8px;
  cursor: pointer;
  filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
  transition: opacity 0.2s ease;
}
.admin-btn:active { opacity: 0.5; }

/* ===== FLOATING PRINT OUT (THE GRID) ===== */
.view-container {
  position: absolute;
  top: calc(env(safe-area-inset-top, 12px) + 70px);
  bottom: 160px; /* Space for shutter */
  left: 20px; right: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  pointer-events: none; 
}

#livePrintOut {
  background: #ffffff;
  display: flex;
  flex-direction: column;
  border-radius: 4px;
  position: relative;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1);
  transition: background 0.3s ease;
  overflow: hidden;
}

#liveGrid {
  flex: 1;
  display: grid;
  position: relative;
  z-index: 1;
}

.grid-slot {
  background: rgba(255,255,255,0.1);
  position: relative;
  overflow: hidden;
  border-radius: 2px;
}

.grid-slot video, .grid-slot img {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: 1;
}

#videoOverlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  transition: background 0.3s ease;
  z-index: 2;
}

#liveText {
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
  position: relative;
  z-index: 2;
}

.event-title {
  font-weight: 800;
  letter-spacing: -0.5px;
  margin: 0;
  text-transform: uppercase;
  transition: color 0.3s ease;
}

.event-subtitle {
  margin-top: 4px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  transition: color 0.3s ease;
}

#stickersContainer {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  z-index: 5;
  overflow: hidden;
}
.sticker {
  position: absolute;
  transform-origin: center;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
}

/* ===== FLASH & COUNTDOWN ===== */
#flashOverlay {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 999;
}

#sequenceIndicator {
  position: absolute;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--glass-bg);
  color: white;
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 600;
  z-index: 20;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

#countdownOverlay {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 160px;
  font-weight: 200;
  color: white;
  text-shadow: 0 10px 40px rgba(0,0,0,0.5);
  z-index: 900;
  transition: transform 0.1s ease;
}

/* ===== FLOATING CONTROLS (BOTTOM) ===== */
.controls-wrapper {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 0 24px calc(env(safe-area-inset-bottom, 12px) + 24px) 24px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  pointer-events: none; 
}

.controls-wrapper > * {
  pointer-events: auto; 
}

/* Floating Settings Pill */
.settings-pill {
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  color: white;
  font-size: 12px;
  font-weight: 600;
  padding: 8px 20px;
  border-radius: var(--radius-pill);
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  margin-bottom: 24px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  transition: all 0.2s ease;
}
.settings-pill:active { background: rgba(50,50,50,0.6); }

/* Shutter Row */
.shutter-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  max-width: 320px;
}

.icon-btn {
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  color: white;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  transition: all 0.2s ease;
}
.icon-btn:active { transform: scale(0.9); }
.icon-btn.active { background: #ffffff; color: #000000; } 

/* Snap/VSCO Premium Shutter */
.shutter {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  border: 4px solid rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 4px; 
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}
.shutter::after {
  content: '';
  width: 100%;
  height: 100%;
  background: #ffffff;
  border-radius: 50%;
  transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}
.shutter:active::after { transform: scale(0.85); }
.shutter:disabled { opacity: 0.4; cursor: not-allowed; }

/* ===== SLIDE-UP BOTTOM SHEET (OPTIONS MENU) ===== */
.bottom-sheet {
  position: fixed;
  bottom: 0; left: 0; width: 100vw;
  background: rgba(15, 15, 15, 0.85);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border-top: 1px solid rgba(255,255,255,0.1);
  border-radius: 32px 32px 0 0;
  padding: 16px 0 calc(env(safe-area-inset-bottom, 16px) + 24px) 0;
  z-index: 100;
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.bottom-sheet.open {
  transform: translateY(0);
}

.drag-handle {
  width: 40px; height: 5px;
  background: rgba(255,255,255,0.3);
  border-radius: 10px;
  margin: 0 auto 8px auto;
}

.scroll-row {
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  gap: 10px;
  padding: 0 24px 8px 24px;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.scroll-row::-webkit-scrollbar { display: none; }

.row-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin: 0 24px -4px 24px;
}

button.opt-btn {
  padding: 10px 20px;
  border-radius: var(--radius-pill);
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  color: white;
  transition: all 0.2s ease;
}
button.opt-btn.active {
  background: white;
  color: black;
  border-color: white;
}

#sheetOverlay {
  position: fixed; inset: 0;
  background: transparent;
  z-index: 90;
  display: none;
}
#sheetOverlay.active { display: block; }

/* ===== UPLOAD OVERLAY ===== */
#uploadControls {
  display: flex;
  gap: 12px;
  width: 100%;
  max-width: 360px;
  margin-top: 16px;
}
#uploadControls button {
  flex: 1;
  padding: 16px;
  border-radius: var(--radius-pill);
  font-size: 15px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  backdrop-filter: blur(10px);
}
#uploadBtn { background: white; color: black; }
#retakeBtn { background: var(--glass-bg); color: white; border: 1px solid var(--glass-border); }

#statusMessage {
  margin-top: 16px;
  padding: 14px 20px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  border: 1px solid var(--glass-border);
}

/* ===== ADMIN MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex; align-items: center; justify-content: center;
  z-index: 999; opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-content {
  background: rgba(25,25,25,0.9);
  padding: 32px 24px;
  border-radius: var(--radius-lg);
  width: 90%; max-width: 340px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 30px 60px rgba(0,0,0,0.5);
}
.modal-content h3 { margin: 0 0 24px 0; font-size: 20px; font-weight: 800; }
.modal-content input {
  width: 100%; padding: 16px; margin-bottom: 12px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 12px; font-size: 15px;
  background: rgba(0,0,0,0.5); color: white;
}
.modal-content input:focus { outline: none; border-color: white; }
.btn-primary {
  width: 100%; padding: 16px; background: white; color: black;
  border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
  cursor: pointer; margin-top: 12px;
}

.hidden { display: none !important; }
</style>
</head>

<body>

<video id="bgVideo" class="bg-video" autoplay playsinline muted></video>
<div class="bg-gradient"></div>

  portra:  { name: "Portra 400", css: "sepia(0.25) contrast(1.05) brightness(1.0) saturate(1.1)", overlay: "rgba(200, 100, 0, 0.03)", vignette: true },
  bw:      { name: "Ilford Noir", css: "grayscale(1) contrast(1.2) brightness(0.95)", overlay: "transparent", vignette: true },
  cinematic:{ name: "Cinematic", css: "saturate(0.8) contrast(1.1) brightness(0.9)", overlay: "rgba(0, 30, 100, 0.08)", vignette: true },
  golden:  { name: "Golden Hour", css: "sepia(0.3) saturate(1.3) contrast(1.05)", overlay: "rgba(255, 120, 0, 0.05)", vignette: false },
  soft:    { name: "Dreamy Glow", css: "blur(0.5px) brightness(1.1) contrast(0.9) saturate(0.9)", overlay: "rgba(255, 255, 255, 0.08)", vignette: false }
};

let currentLayoutKey = "single";
let currentTimerKey = "t3";
let currentFrameKey = "polaroid";
let currentFilterKey = "none";

/* ================= DOM ELEMENTS ================= */
const bgVideo = document.getElementById("bgVideo");
const bgVideoOverlay = document.getElementById("bgVideoOverlay");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");

const videoOverlay = document.getElementById("videoOverlay");
const flashOverlay = document.getElementById("flashOverlay");
const countdownOverlay = document.getElementById("countdownOverlay");
const sequenceIndicator = document.getElementById("sequenceIndicator");

const viewContainer = document.getElementById("viewContainer");
const livePrintOut = document.getElementById("livePrintOut");
const liveGrid = document.getElementById("liveGrid");
const stickersContainer = document.getElementById("stickersContainer");
const overlayTitle = document.getElementById("overlayTitle");
const overlaySubtitle = document.getElementById("overlaySubtitle");
const liveText = document.getElementById("liveText");

const optionsSheet = document.getElementById("optionsSheet");
const sheetOverlay = document.getElementById("sheetOverlay");
const openSettingsBtn = document.getElementById("openSettingsBtn");

const mainControls = document.getElementById("mainControls");
const uploadWrapper = document.getElementById("uploadWrapper");
const uploadControls = document.getElementById("uploadControls");

const shutterBtn = document.getElementById("shutter");
const flipBtn = document.getElementById("flipBtn");
const flashBtn = document.getElementById("flashBtn");
const retakeBtn = document.getElementById("retakeBtn");
const uploadBtn = document.getElementById("uploadBtn");

const openAdminBtn = document.getElementById("openAdminBtn");
const adminModal = document.getElementById("adminModal");
const adminPin = document.getElementById("adminPin");
const loginBtn = document.getElementById("loginBtn");
const adminLoginView = document.getElementById("adminLoginView");
const adminSettingsView = document.getElementById("adminSettingsView");
const saveAdminBtn = document.getElementById("saveAdminBtn");

const inputTitle = document.getElementById("inputTitle");
const inputSubtitle = document.getElementById("inputSubtitle");

/* ================= INITIALIZATION ================= */
function initUI() {
  const layoutControls = document.getElementById("layoutControls");
  Object.keys(LAYOUTS).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "opt-btn" + (key === currentLayoutKey ? " active" : "");
    btn.textContent = LAYOUTS[key].name;
    btn.onclick = () => {
      currentLayoutKey = key;
      document.querySelectorAll('#layoutControls button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyLayout(); 
    };
    layoutControls.appendChild(btn);
  });

  const timerControls = document.getElementById("timerControls");
  Object.keys(TIMERS).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "opt-btn" + (key === currentTimerKey ? " active" : "");
    btn.textContent = TIMERS[key].name;
    btn.onclick = () => {
      currentTimerKey = key;
      document.querySelectorAll('#timerControls button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    timerControls.appendChild(btn);
  });

  const themeControls = document.getElementById("themeControls");
  Object.keys(FRAMES).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "opt-btn" + (key === currentFrameKey ? " active" : "");
    btn.textContent = FRAMES[key].name;
    btn.onclick = () => {
      currentFrameKey = key;
      document.querySelectorAll('#themeControls button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyTheme(); 
      applyLayout(); // Ensure correct sticker dimensions get reapplied!
    };
    themeControls.appendChild(btn);
  });

  const filterControls = document.getElementById("filterControls");
  Object.keys(FILTERS).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "opt-btn" + (key === currentFilterKey ? " active" : "");
    btn.textContent = FILTERS[key].name;
    btn.onclick = () => {
      currentFilterKey = key;
      document.querySelectorAll('#filterControls button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyLiveFilter(); 
    };
    filterControls.appendChild(btn);
  });

  applyAdminText();
  applyTheme();
  applyLayout();
  applyLiveFilter();
  startCamera();
  
  window.addEventListener('resize', applyLayout);
}

/* ================= BOTTOM SHEET LOGIC ================= */
function toggleSheet() {
  sheetOpen = !sheetOpen;
  if (sheetOpen) {
    optionsSheet.classList.add('open');
    sheetOverlay.classList.add('active');
  } else {
    optionsSheet.classList.remove('open');
    sheetOverlay.classList.remove('active');
  }
}
openSettingsBtn.onclick = toggleSheet;
sheetOverlay.onclick = toggleSheet;

/* ================= ADMIN LOGIC ================= */
openAdminBtn.onclick = () => {
  adminPin.value = '';
  adminLoginView.classList.remove('hidden');
  adminSettingsView.classList.add('hidden');
  adminModal.classList.add('active');
};
loginBtn.onclick = () => {
  if (adminPin.value === ADMIN_PIN) {
    adminLoginView.classList.add('hidden');
    adminSettingsView.classList.remove('hidden');
    inputTitle.value = EVENT_NAME;
    inputSubtitle.value = EVENT_DATE;
  } else { alert("Incorrect PIN"); }
};
saveAdminBtn.onclick = () => {
  EVENT_NAME = inputTitle.value.trim() || "Event Gallery";
  EVENT_DATE = inputSubtitle.value.trim() || "Captured today";
  localStorage.setItem("snapback_event_name", EVENT_NAME);
  localStorage.setItem("snapback_event_date", EVENT_DATE);
  applyAdminText();
  adminModal.classList.remove('active');
};
function applyAdminText() {
  overlayTitle.textContent = EVENT_NAME;
  overlaySubtitle.textContent = EVENT_DATE;
}

/* ================= LIVE PREVIEWS & GRID ================= */
function applyTheme() {
  const frame = FRAMES[currentFrameKey];
  livePrintOut.style.background = frame.bgFill;
  overlayTitle.style.color = frame.textCol;
  
  if(frame.bgFill === "#111111") {
     overlaySubtitle.style.color = 'rgba(255,255,255,0.6)';
  } else {
     overlaySubtitle.style.color = 'rgba(0,0,0,0.5)';
  }
  
  stickersContainer.innerHTML = '';
  if (frame.stickers) {
    frame.stickers.forEach(s => {
      const el = document.createElement('div');
      el.className = 'sticker';
      el.textContent = s.emoji;
      el.dataset.size = s.size; // Save raw ratio to handle scaling mathematically
      if (s.left) el.style.left = s.left;
      if (s.right) el.style.right = s.right;
      if (s.top) el.style.top = s.top;
      if (s.bottom) el.style.bottom = s.bottom;
      el.style.transform = `rotate(${s.angle}deg)`;
      stickersContainer.appendChild(el);
    });
  }
}

function applyLiveFilter() {
  const f = FILTERS[currentFilterKey];
  video.style.filter = f.css;
  bgVideo.style.filter = f.css;
  
  let bgOverlayGrad = `linear-gradient(${f.overlay}, ${f.overlay})`;
  if (f.vignette) bgOverlayGrad += `, radial-gradient(circle, transparent 35%, rgba(0,0,0,0.6) 120%)`;
  
  videoOverlay.style.background = bgOverlayGrad;
  bgVideoOverlay.style.background = bgOverlayGrad;
}

function applyLayout() {
  const layout = LAYOUTS[currentLayoutKey];

  if (video.parentNode !== viewContainer) viewContainer.appendChild(video);
  if (videoOverlay.parentNode !== viewContainer) viewContainer.appendChild(videoOverlay);

  liveGrid.innerHTML = ''; 
  
  const pW = 720;
  const pH = layout.crop === 'square' ? 720 : 960;
  const gap = 24; 
  const outerPad = 32; 
  const bottomSpace = 240; 

  const totalW = (outerPad * 2) + (pW * layout.cols) + (gap * (layout.cols - 1));
  const totalH = outerPad + bottomSpace + (pH * layout.rows) + (gap * (layout.rows - 1));
  
  const vcW = viewContainer.clientWidth; 
  const vcH = viewContainer.clientHeight; 
  const targetRatio = totalW / totalH;
  
  let scale;
  // Fit securely inside the view bounds mathematically!
  // This completely fixes the CSS "no grid" bug for older browsers.
  if (vcW / vcH > targetRatio) {
    scale = vcH / totalH;
  } else {
    scale = vcW / totalW;
  }

  livePrintOut.style.width = `${totalW * scale}px`;
  livePrintOut.style.height = `${totalH * scale}px`;
  livePrintOut.style.padding = `${outerPad * scale}px ${outerPad * scale}px 0 ${outerPad * scale}px`;
  liveGrid.style.gap = `${gap * scale}px`;
  
  liveText.style.height = `${bottomSpace * scale}px`;
  liveText.style.flex = `0 0 ${bottomSpace * scale}px`;

  overlayTitle.style.fontSize = `${totalW * scale * 0.05}px`;
  overlaySubtitle.style.fontSize = `${totalW * scale * 0.022}px`;
  
  // Update sticker sizes based on pure mathematics, no CSS container queries!
  document.querySelectorAll('.sticker').forEach(el => {
    const sizeRatio = parseFloat(el.dataset.size);
    el.style.fontSize = `${sizeRatio * totalW * scale}px`;
  });

  liveGrid.style.gridTemplateColumns = `repeat(${layout.cols}, 1fr)`;
  liveGrid.style.gridTemplateRows = `repeat(${layout.rows}, 1fr)`;

  for (let i = 0; i < layout.count; i++) {
    const slot = document.createElement('div');
    slot.className = 'grid-slot';
    slot.id = `slot-${i}`;
    liveGrid.appendChild(slot);
  }

  const firstSlot = document.getElementById('slot-0');
  if (firstSlot) {
    video.classList.remove('hidden');
    videoOverlay.classList.remove('hidden');
    firstSlot.appendChild(video);
    firstSlot.appendChild(videoOverlay);
  }
}

/* ================= CAMERA CONTROL ================= */
async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    // FIX: Request 1080x1440 (a perfect 3:4 ratio) 
    // This perfectly matches the 720x960 grid slots to stop the device from artificially zooming!
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facingMode, width: { ideal: 1080 }, height: { ideal: 1440 } }
    });
    video.srcObject = stream;
    bgVideo.srcObject = stream;
    
    const trans = facingMode === "user" ? "scaleX(-1)" : "scaleX(1)";
    video.style.transform = trans;
    bgVideo.style.transform = trans;
  } catch (err) {
    alert("Camera access is required for the photobooth to function.");
  }
}

flipBtn.onclick = () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  startCamera();
};

flashBtn.onclick = async () => {
  flashEnabled = !flashEnabled;
  flashBtn.classList.toggle("active", flashEnabled);
  
  if (stream) {
    const track = stream.getVideoTracks()[0];
    if (typeof track.getCapabilities === "function" && track.getCapabilities().torch) {
      try { await track.applyConstraints({ advanced: [{ torch: flashEnabled }] }); } catch(e){}
    }
  }
};

/* ================= SEQUENCE CAPTURE LOGIC ================= */
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function doCountdown(seconds) {
  countdownOverlay.classList.remove("hidden");
  for (let i = seconds; i > 0; i--) {
    countdownOverlay.textContent = i;
    countdownOverlay.style.transform = "translate(-50%, -50%) scale(1.1)";
    setTimeout(() => { countdownOverlay.style.transform = "translate(-50%, -50%) scale(1)"; }, 150);
    await sleep(1000);
  }
  countdownOverlay.classList.add("hidden");
}

function triggerScreenFlash() {
  flashOverlay.style.transition = "none";
  flashOverlay.style.opacity = "1";
  setTimeout(() => {
    flashOverlay.style.transition = "opacity 0.4s ease-out";
    flashOverlay.style.opacity = "0";
  }, 100);
}

shutterBtn.onclick = async () => {
  const layout = LAYOUTS[currentLayoutKey];
  const timerVal = TIMERS[currentTimerKey].value;
  capturedPhotos = [];
  
  shutterBtn.disabled = true;
  mainControls.style.opacity = "0.4";
  mainControls.style.pointerEvents = "none";
  
  if (sheetOpen) toggleSheet();
  
  if (layout.count > 1) {
    sequenceIndicator.classList.remove("hidden");
  }

  for (let i = 0; i < layout.count; i++) {
    if (layout.count > 1) {
      sequenceIndicator.textContent = `Photo ${i + 1} of ${layout.count}`;
    }
    
    if (timerVal > 0) {
      await doCountdown(timerVal);
    } else {
      if (i > 0) await sleep(1000);
    }
    
    if (flashEnabled) {
      triggerScreenFlash();
      await sleep(150);
    }

    const frameCanvas = grabSingleFrame(layout);
    capturedPhotos.push(frameCanvas);

    const img = document.createElement("img");
    img.src = frameCanvas.toDataURL("image/jpeg", 0.9);

    const currentSlot = document.getElementById(`slot-${i}`);
    currentSlot.appendChild(img);

    if (i + 1 < layout.count) {
      const nextSlot = document.getElementById(`slot-${i + 1}`);
      nextSlot.appendChild(video);
      nextSlot.appendChild(videoOverlay);
      await sleep(600); 
    } else {
      video.classList.add('hidden');
      videoOverlay.classList.add('hidden');
    }
  }

  sequenceIndicator.classList.add("hidden");
  buildComposition(capturedPhotos, layout);
  
  mainControls.classList.add("hidden");
  uploadWrapper.classList.remove("hidden");
};

/* ================= PERFECT CENTER CROP MATH ================= */
function grabSingleFrame(layout) {
  const isSquare = layout.crop === 'square';
  const cW = 720;
  const cH = isSquare ? 720 : 960;

  const offCanvas = document.createElement("canvas");
  offCanvas.width = cW;
  offCanvas.height = cH;
  const octx = offCanvas.getContext("2d");

  if (facingMode === "user") {
    octx.translate(cW, 0);
    octx.scale(-1, 1);
  }
  
  octx.filter = FILTERS[currentFilterKey].css;

  const vW = video.videoWidth || 1080;
  const vH = video.videoHeight || 1920;
  const vRatio = vW / vH;
  const cRatio = cW / cH;

  let sX = 0, sY = 0, sW = vW, sH = vH;

  if (vRatio > cRatio) {
    sW = vH * cRatio;
    sX = (vW - sW) / 2;
  } else {
    sH = vW / cRatio;
    sY = (vH - sH) / 2;
  }

  octx.drawImage(video, sX, sY, sW, sH, 0, 0, cW, cH);
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.filter = "none";

  const filter = FILTERS[currentFilterKey];
  if (filter.overlay !== 'transparent') {
    octx.fillStyle = filter.overlay;
    octx.fillRect(0, 0, cW, cH);
  }
  if (filter.vignette) {
    const v = octx.createRadialGradient(cW/2, cH/2, cW/4, cW/2, cH/2, Math.max(cW, cH));
    v.addColorStop(0, "rgba(0,0,0,0)");
    v.addColorStop(1, "rgba(0,0,0,0.6)");
    octx.fillStyle = v;
    octx.fillRect(0, 0, cW, cH);
  }
  
  return offCanvas;
}

/* ================= BUILD FINAL HIGH-RES UPLOAD ================= */
function buildComposition(photos, layout) {
  const frame = FRAMES[currentFrameKey];
  const pW = 720;
  const pH = layout.crop === 'square' ? 720 : 960; 
  const gap = 24;
  const outerPad = 32;
  const bottomSpace = 240; 

  canvas.width = (outerPad * 2) + (pW * layout.cols) + (gap * (layout.cols - 1));
  canvas.height = outerPad + bottomSpace + (pH * layout.rows) + (gap * (layout.rows - 1));

  ctx.fillStyle = frame.bgFill;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  photos.forEach((photoCanvas, i) => {
    const col = i % layout.cols;
    const row = Math.floor(i / layout.cols);
    const x = outerPad + col * (pW + gap);
    const y = outerPad + row * (pH + gap);
    
    ctx.drawImage(photoCanvas, x, y, pW, pH);
  });

  ctx.textAlign = "center";
  ctx.fillStyle = frame.textCol;
  
  const textY = canvas.height - (bottomSpace * 0.45);
  ctx.font = `800 ${canvas.width * 0.05}px -apple-system, sans-serif`;
  ctx.fillText(EVENT_NAME.toUpperCase(), canvas.width / 2, textY);
  
  ctx.font = `500 ${canvas.width * 0.022}px -apple-system, sans-serif`;
  
  if(frame.bgFill === "#111111") {
     ctx.fillStyle = 'rgba(255,255,255,0.6)';
  } else {
     ctx.fillStyle = 'rgba(0,0,0,0.5)';
  }
  ctx.fillText(EVENT_DATE.toUpperCase(), canvas.width / 2, textY + (canvas.width * 0.04));

  if (frame.stickers) {
    frame.stickers.forEach(s => {
      ctx.font = `${canvas.width * s.size}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      let x = 0; let y = 0;
      if (s.left) x = canvas.width * (parseFloat(s.left) / 100);
      if (s.right) x = canvas.width - (canvas.width * (parseFloat(s.right) / 100));
      if (s.top) y = canvas.height * (parseFloat(s.top) / 100);
      if (s.bottom) y = canvas.height - (canvas.height * (parseFloat(s.bottom) / 100));

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate((s.angle * Math.PI) / 180);
      ctx.shadowColor = "rgba(0,0,0,0.15)";
      ctx.shadowBlur = canvas.width * 0.015;
      ctx.shadowOffsetY = canvas.width * 0.005;
      ctx.fillText(s.emoji, 0, 0);
      ctx.restore();
    });
  }
}

/* ================= UPLOAD & RETAKE ================= */
retakeBtn.onclick = () => {
  uploadWrapper.classList.add("hidden");
  document.getElementById("statusMessage").classList.add("hidden");
  
  applyLayout();
  mainControls.classList.remove("hidden");
  
  shutterBtn.disabled = false;
  mainControls.style.opacity = "1";
  mainControls.style.pointerEvents = "auto";
};

uploadBtn.onclick = async () => {
  uploadBtn.disabled = true;
  retakeBtn.disabled = true;
  const statusMessage = document.getElementById("statusMessage");
  statusMessage.className = "loading";
  statusMessage.textContent = "Processing gallery upload...";
  statusMessage.classList.remove("hidden");

  try {
    const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.9));
    const base64 = await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = () => res(reader.result.split(",")[1]);
      reader.onerror = rej;
      reader.readAsDataURL(blob);
    });

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 35000); 

    const res = await fetch(UPLOAD_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      signal: controller.signal,
      body: JSON.stringify({
        file: base64,
        filename: `snapback_${Date.now()}.jpg`,
        mimeType: "image/jpeg"
      })
    });
    
    clearTimeout(timeout);
    if (!res.ok) throw new Error("Server error");
    await res.text();

    statusMessage.className = "success";
    statusMessage.textContent = "Upload complete.";
    uploadControls.classList.add("hidden");

    setTimeout(() => {
      retakeBtn.onclick(); 
      uploadBtn.disabled = false;
      retakeBtn.disabled = false;
      uploadControls.classList.remove("hidden");
    }, 2500);

  } catch (err) {
    statusMessage.className = "error";
    statusMessage.textContent = "Upload failed. Please check connection.";
    uploadBtn.disabled = false;
    retakeBtn.disabled = false;
  }
};

/* Start up */
initUI();
</script>
