<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
<title>SNAPBACK Camera</title>

<style>
/* ===== VSCO / SNAPCHAT IMMERSIVE AESTHETIC ===== */
:root {
  --text-main: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.6);
  --glass-bg: rgba(20, 20, 20, 0.4);
  --glass-border: rgba(255, 255, 255, 0.15);
  --accent: #ffffff;
  --radius-lg: 32px;
  --radius-pill: 100px;
}

* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
  -webkit-tap-highlight-color: transparent;
  font-smooth: always;
  -webkit-font-smoothing: antialiased;
}

body {
  margin: 0;
  background: #000000;
  color: var(--text-main);
  /* Strictly lock to viewport - NO SCROLLING */
  height: 100vh;
  height: 100dvh; 
  width: 100vw;
  overflow: hidden; 
  position: relative;
}

/* ===== FULL SCREEN BACKGROUND CAMERA ===== */
.bg-video {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  object-fit: cover;
  z-index: 0;
}

/* Gradient overlay to ensure UI is always readable over bright cameras */
.bg-gradient {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 15%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.7) 100%);
  z-index: 1;
  pointer-events: none;
}

/* Secondary filter overlay for the background video */
.bg-filter-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  z-index: 2;
  pointer-events: none;
  transition: background 0.3s ease;
}

/* ===== FLOATING HEADER ===== */
header {
  position: absolute;
  top: env(safe-area-inset-top, 12px);
  left: 0; right: 0;
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}

.brand h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.5px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}

.tagline {
  font-size: 10px;
  font-weight: 600;
  color: rgba(255,255,255,0.8);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-top: 2px;
  text-shadow: 0 1px 5px rgba(0,0,0,0.3);
}

.admin-btn {
  background: transparent;
  border: none;
  color: white;
  padding: 8px;
  cursor: pointer;
  filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
  transition: opacity 0.2s ease;
}
.admin-btn:active { opacity: 0.5; }

/* ===== LIVE TEXT OVERLAY ===== */
#liveTextOverlay {
  position: absolute;
  bottom: 180px; 
  left: 0; 
  width: 100vw; 
  text-align: center; 
  z-index: 10; 
  pointer-events: none;
}

.event-title {
  font-weight: 800;
  font-size: 24px; 
  letter-spacing: -0.5px;
  margin: 0;
  text-transform: uppercase;
  text-shadow: 0 4px 12px rgba(0,0,0,0.5);
}

.event-subtitle {
  font-size: 12px; 
  margin-top: 4px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.8);
  text-shadow: 0 4px 12px rgba(0,0,0,0.5);
}

/* ===== FLASH & COUNTDOWN ===== */
#flashOverlay {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 999;
}

#countdownOverlay {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 160px;
  font-weight: 200;
  color: white;
  text-shadow: 0 10px 40px rgba(0,0,0,0.5);
  z-index: 900;
  transition: transform 0.1s ease;
}

/* ===== FLOATING CONTROLS (BOTTOM) ===== */
.controls-wrapper {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 0 24px calc(env(safe-area-inset-bottom, 12px) + 24px) 24px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  pointer-events: none; 
}

.controls-wrapper > * {
  pointer-events: auto; 
}

/* Floating Settings Pill */
.settings-pill {
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  color: white;
  font-size: 12px;
  font-weight: 600;
  padding: 8px 20px;
  border-radius: var(--radius-pill);
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  margin-bottom: 24px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  transition: all 0.2s ease;
}
.settings-pill:active { background: rgba(50,50,50,0.6); }

/* Shutter Row */
.shutter-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  max-width: 320px;
}

.icon-btn {
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  color: white;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  transition: all 0.2s ease;
}
.icon-btn:active { transform: scale(0.9); }
.icon-btn.active { background: #ffffff; color: #000000; } 

/* Snap/VSCO Premium Shutter */
.shutter {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  border: 4px solid rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 4px; 
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}
.shutter::after {
  content: '';
  width: 100%;
  height: 100%;
  background: #ffffff;
  border-radius: 50%;
  transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}
.shutter:active::after { transform: scale(0.85); }
.shutter:disabled { opacity: 0.4; cursor: not-allowed; }

/* ===== SLIDE-UP BOTTOM SHEET (OPTIONS MENU) ===== */
.bottom-sheet {
  position: fixed;
  bottom: 0; left: 0; width: 100vw;
  background: rgba(15, 15, 15, 0.85);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border-top: 1px solid rgba(255,255,255,0.1);
  border-radius: 32px 32px 0 0;
  padding: 16px 0 calc(env(safe-area-inset-bottom, 16px) + 24px) 0;
  z-index: 100;
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.bottom-sheet.open {
  transform: translateY(0);
}

.drag-handle {
  width: 40px; height: 5px;
  background: rgba(255,255,255,0.3);
  border-radius: 10px;
  margin: 0 auto 8px auto;
}

.scroll-row {
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  gap: 10px;
  padding: 0 24px 8px 24px;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.scroll-row::-webkit-scrollbar { display: none; }

.row-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin: 0 24px -4px 24px;
}

button.opt-btn {
  padding: 10px 20px;
  border-radius: var(--radius-pill);
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  color: white;
  transition: all 0.2s ease;
}
button.opt-btn.active {
  background: white;
  color: black;
  border-color: white;
}

#sheetOverlay {
  position: fixed; inset: 0;
  background: transparent;
  z-index: 90;
  display: none;
}
#sheetOverlay.active { display: block; }

/* ===== UPLOAD OVERLAY ===== */
#uploadControls {
  display: flex;
  gap: 12px;
  width: 100%;
  max-width: 360px;
  margin-top: 16px;
}
#uploadControls button {
  flex: 1;
  padding: 16px;
  border-radius: var(--radius-pill);
  font-size: 15px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  backdrop-filter: blur(10px);
}
#uploadBtn { background: white; color: black; }
#retakeBtn { background: var(--glass-bg); color: white; border: 1px solid var(--glass-border); }

#statusMessage {
  margin-top: 16px;
  padding: 14px 20px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  border: 1px solid var(--glass-border);
}

/* ===== ADMIN MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex; align-items: center; justify-content: center;
  z-index: 999; opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-content {
  background: rgba(25,25,25,0.9);
  padding: 32px 24px;
  border-radius: var(--radius-lg);
  width: 90%; max-width: 340px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 30px 60px rgba(0,0,0,0.5);
}
.modal-content h3 { margin: 0 0 24px 0; font-size: 20px; font-weight: 800; }
.modal-content input {
  width: 100%; padding: 16px; margin-bottom: 12px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 12px; font-size: 15px;
  background: rgba(0,0,0,0.5); color: white;
}
.modal-content input:focus { outline: none; border-color: white; }
.btn-primary {
  width: 100%; padding: 16px; background: white; color: black;
  border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
  cursor: pointer; margin-top: 12px;
}

.hidden { display: none !important; }
</style>
</head>

<body>

<!-- Full Screen Video Background -->
<video id="bgVideo" class="bg-video" autoplay playsinline muted></video>
<div class="bg-gradient"></div>
<div id="bgVideoOverlay" class="bg-filter-overlay"></div>

<!-- Full Screen Image Preview Overlay -->
<img id="previewImage" class="hidden" style="position: fixed; inset: 0; width: 100vw; height: 100dvh; object-fit: cover; z-index: 15;">

<!-- Live Text Always Overlaid -->
<div id="liveTextOverlay">
  <div class="event-title" id="overlayTitle"></div>
  <div class="event-subtitle" id="overlaySubtitle"></div>
</div>

<header>
  <div class="brand">
    <h1>SNAPBACK</h1>
    <div class="tagline">Camera Edition</div>
  </div>
  <button class="admin-btn" id="openAdminBtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
  </button>
</header>

<div id="countdownOverlay" class="hidden">3</div>
<div id="flashOverlay"></div>

<!-- Off-screen Canvas for High-Res Processing -->
<canvas id="canvas" class="hidden"></canvas>

<!-- Pinned Floating Bottom Controls -->
<div class="controls-wrapper" id="mainControls">
  <button class="settings-pill" id="openSettingsBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    Filters & Timer
  </button>
  
  <div class="shutter-row">
    <button class="icon-btn" id="flashBtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
    </button>
    <button class="shutter" id="shutter"></button>
    <button class="icon-btn" id="flipBtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
    </button>
  </div>
</div>

<div class="controls-wrapper hidden" id="uploadWrapper">
  <div id="uploadControls">
    <button id="retakeBtn">Retake</button>
    <button id="uploadBtn">Save to Gallery</button>
  </div>
  <div id="statusMessage" class="hidden"></div>
</div>

<!-- Invisible overlay to close bottom sheet on outside click -->
<div id="sheetOverlay"></div>

<!-- Slide Up Bottom Sheet -->
<div class="bottom-sheet" id="optionsSheet">
  <div class="drag-handle"></div>

  <div class="row-label">Timer</div>
  <div class="scroll-row" id="timerControls"></div>

  <div class="row-label">Analog Filter</div>
  <div class="scroll-row" id="filterControls"></div>
</div>

<!-- Admin Settings -->
<div class="modal-overlay" id="adminModal">
  <div class="modal-content">
    <h3>Configuration</h3>
    <div id="adminLoginView">
      <input type="password" id="adminPin" placeholder="Enter PIN" inputmode="numeric">
      <button class="btn-primary" id="loginBtn">Unlock</button>
    </div>
    <div id="adminSettingsView" class="hidden">
      <input type="text" id="inputTitle" placeholder="Event Name" maxlength="25">
      <input type="text" id="inputSubtitle" placeholder="Event Subtitle" maxlength="35">
      <button class="btn-primary" id="saveAdminBtn">Save Config</button>
    </div>
  </div>
</div>

<script>
/* ================= GLOBAL STATE ================= */
let EVENT_NAME = localStorage.getItem("snapback_event_name") || "Event Gallery";
let EVENT_DATE = localStorage.getItem("snapback_event_date") || "Captured today";
const UPLOAD_URL = "https://script.google.com/macros/s/AKfycbxX9wMOWPLZrimEpvdojQsOh6ESW8kgBw3BK_qYX6VJC8s05tKgYS7BqrnULgrFS5zB/exec";

let stream = null;
let facingMode = "environment";
let flashEnabled = false;
let sheetOpen = false;
const ADMIN_PIN = "1234"; 

/* ================= CONFIGURATIONS ================= */
const TIMERS = {
  t3:  { name: "3s", value: 3 },
  t5:  { name: "5s", value: 5 },
  off: { name: "Off", value: 0 }
};

const FILTERS = {
  none:    { name: "Normal", css: "none", overlay: "transparent", vignette: false },
  fuji400: { name: "Fuji Pro 400H", css: "contrast(0.95) brightness(1.05) saturate(0.85) sepia(0.1) hue-rotate(-15deg)", overlay: "rgba(0, 40, 20, 0.04)", vignette: true },
  chrome:  { name: "Classic Chrome", css: "contrast(1.15) brightness(0.95) saturate(0.6) sepia(0.15)", overlay: "rgba(30, 10, 0, 0.05)", vignette: true },
  superia: { name: "Superia 400", css: "contrast(1.1) brightness(0.95) saturate(1.2)", overlay: "rgba(0, 60, 20, 0.05)", vignette: false },
  portra:  { name: "Portra 400", css: "sepia(0.25) contrast(1.05) brightness(1.0) saturate(1.1)", overlay: "rgba(200, 100, 0, 0.03)", vignette: true },
  bw:      { name: "Ilford Noir", css: "grayscale(1) contrast(1.2) brightness(0.95)", overlay: "transparent", vignette: true },
  cinematic:{ name: "Cinematic", css: "saturate(0.8) contrast(1.1) brightness(0.9)", overlay: "rgba(0, 30, 100, 0.08)", vignette: true },
  golden:  { name: "Golden Hour", css: "sepia(0.3) saturate(1.3) contrast(1.05)", overlay: "rgba(255, 120, 0, 0.05)", vignette: false },
  soft:    { name: "Dreamy Glow", css: "blur(0.5px) brightness(1.1) contrast(0.9) saturate(0.9)", overlay: "rgba(255, 255, 255, 0.08)", vignette: false }
};

let currentTimerKey = "t3";
let currentFilterKey = "none";

/* ================= DOM ELEMENTS ================= */
const bgVideo = document.getElementById("bgVideo");
const bgVideoOverlay = document.getElementById("bgVideoOverlay");
const canvas = document.getElementById("canvas");
const previewImage = document.getElementById("previewImage");

const flashOverlay = document.getElementById("flashOverlay");
const countdownOverlay = document.getElementById("countdownOverlay");

const overlayTitle = document.getElementById("overlayTitle");
const overlaySubtitle = document.getElementById("overlaySubtitle");

const optionsSheet = document.getElementById("optionsSheet");
const sheetOverlay = document.getElementById("sheetOverlay");
const openSettingsBtn = document.getElementById("openSettingsBtn");

const mainControls = document.getElementById("mainControls");
const uploadWrapper = document.getElementById("uploadWrapper");
const uploadControls = document.getElementById("uploadControls");

const shutterBtn = document.getElementById("shutter");
const flipBtn = document.getElementById("flipBtn");
const flashBtn = document.getElementById("flashBtn");
const retakeBtn = document.getElementById("retakeBtn");
const uploadBtn = document.getElementById("uploadBtn");

const openAdminBtn = document.getElementById("openAdminBtn");
const adminModal = document.getElementById("adminModal");
const adminPin = document.getElementById("adminPin");
const loginBtn = document.getElementById("loginBtn");
const adminLoginView = document.getElementById("adminLoginView");
const adminSettingsView = document.getElementById("adminSettingsView");
const saveAdminBtn = document.getElementById("saveAdminBtn");

const inputTitle = document.getElementById("inputTitle");
const inputSubtitle = document.getElementById("inputSubtitle");

/* ================= INITIALIZATION ================= */
function initUI() {
  const timerControls = document.getElementById("timerControls");
  Object.keys(TIMERS).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "opt-btn" + (key === currentTimerKey ? " active" : "");
    btn.textContent = TIMERS[key].name;
    btn.onclick = () => {
      currentTimerKey = key;
      document.querySelectorAll('#timerControls button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    timerControls.appendChild(btn);
  });

  const filterControls = document.getElementById("filterControls");
  Object.keys(FILTERS).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "opt-btn" + (key === currentFilterKey ? " active" : "");
    btn.textContent = FILTERS[key].name;
    btn.onclick = () => {
      currentFilterKey = key;
      document.querySelectorAll('#filterControls button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyLiveFilter(); 
    };
    filterControls.appendChild(btn);
  });

  applyAdminText();
  applyLiveFilter();
  startCamera();
}

/* ================= BOTTOM SHEET LOGIC ================= */
function toggleSheet() {
  sheetOpen = !sheetOpen;
  if (sheetOpen) {
    optionsSheet.classList.add('open');
    sheetOverlay.classList.add('active');
  } else {
    optionsSheet.classList.remove('open');
    sheetOverlay.classList.remove('active');
  }
}
openSettingsBtn.onclick = toggleSheet;
sheetOverlay.onclick = toggleSheet;

/* ================= ADMIN LOGIC ================= */
openAdminBtn.onclick = () => {
  adminPin.value = '';
  adminLoginView.classList.remove('hidden');
  adminSettingsView.classList.add('hidden');
  adminModal.classList.add('active');
};
loginBtn.onclick = () => {
  if (adminPin.value === ADMIN_PIN) {
    adminLoginView.classList.add('hidden');
    adminSettingsView.classList.remove('hidden');
    inputTitle.value = EVENT_NAME;
    inputSubtitle.value = EVENT_DATE;
  } else { alert("Incorrect PIN"); }
};
saveAdminBtn.onclick = () => {
  EVENT_NAME = inputTitle.value.trim() || "Event Gallery";
  EVENT_DATE = inputSubtitle.value.trim() || "Captured today";
  localStorage.setItem("snapback_event_name", EVENT_NAME);
  localStorage.setItem("snapback_event_date", EVENT_DATE);
  applyAdminText();
  adminModal.classList.remove('active');
};
function applyAdminText() {
  overlayTitle.textContent = EVENT_NAME;
  overlaySubtitle.textContent = EVENT_DATE;
}

/* ================= LIVE PREVIEWS ================= */
function applyLiveFilter() {
  const f = FILTERS[currentFilterKey];
  bgVideo.style.filter = f.css;
  let bgOverlayGrad = `linear-gradient(${f.overlay}, ${f.overlay})`;
  if (f.vignette) bgOverlayGrad += `, radial-gradient(circle, transparent 35%, rgba(0,0,0,0.6) 120%)`;
  bgVideoOverlay.style.background = bgOverlayGrad;
}

/* ================= CAMERA CONTROL ================= */
async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facingMode, width: { ideal: 1080 }, height: { ideal: 1920 } }
    });
    bgVideo.srcObject = stream;
    const trans = facingMode === "user" ? "scaleX(-1)" : "scaleX(1)";
    bgVideo.style.transform = trans;
  } catch (err) {
    alert("Camera access is required for the app to function.");
  }
}

flipBtn.onclick = () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  startCamera();
};

flashBtn.onclick = async () => {
  flashEnabled = !flashEnabled;
  flashBtn.classList.toggle("active", flashEnabled);
  
  if (stream) {
    const track = stream.getVideoTracks()[0];
    if (typeof track.getCapabilities === "function" && track.getCapabilities().torch) {
      try { await track.applyConstraints({ advanced: [{ torch: flashEnabled }] }); } catch(e){}
    }
  }
};

/* ================= SEQUENCE CAPTURE LOGIC ================= */
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function doCountdown(seconds) {
  countdownOverlay.classList.remove("hidden");
  for (let i = seconds; i > 0; i--) {
    countdownOverlay.textContent = i;
    countdownOverlay.style.transform = "translate(-50%, -50%) scale(1.1)";
    setTimeout(() => { countdownOverlay.style.transform = "translate(-50%, -50%) scale(1)"; }, 150);
    await sleep(1000);
  }
  countdownOverlay.classList.add("hidden");
}

function triggerScreenFlash() {
  flashOverlay.style.transition = "none";
  flashOverlay.style.opacity = "1";
  setTimeout(() => {
    flashOverlay.style.transition = "opacity 0.4s ease-out";
    flashOverlay.style.opacity = "0";
  }, 100);
}

shutterBtn.onclick = async () => {
  const timerVal = TIMERS[currentTimerKey].value;
  
  shutterBtn.disabled = true;
  mainControls.style.opacity = "0.4";
  mainControls.style.pointerEvents = "none";
  
  if (sheetOpen) toggleSheet();
  
  if (timerVal > 0) {
    await doCountdown(timerVal);
  }
  
  if (flashEnabled) {
    triggerScreenFlash();
    await sleep(150);
  }

  grabFullScreen();

  // Set the high-res canvas image as our preview overlay
  previewImage.src = canvas.toDataURL("image/jpeg", 0.9);
  previewImage.classList.remove("hidden");
  
  mainControls.classList.add("hidden");
  uploadWrapper.classList.remove("hidden");
};

/* ================= PERFECT FULL SCREEN CROP MATH ================= */
function grabFullScreen() {
  const cW = 1080;
  const cH = 1920; 

  canvas.width = cW;
  canvas.height = cH;
  const octx = canvas.getContext("2d");

  // Handle Mirroring
  if (facingMode === "user") {
    octx.translate(cW, 0);
    octx.scale(-1, 1);
  }
  
  octx.filter = FILTERS[currentFilterKey].css;

  const vW = bgVideo.videoWidth || 1080;
  const vH = bgVideo.videoHeight || 1920;
  const vRatio = vW / vH;
  const cRatio = cW / cH;

  let sX = 0, sY = 0, sW = vW, sH = vH;

  if (vRatio > cRatio) {
    sW = vH * cRatio;
    sX = (vW - sW) / 2;
  } else {
    sH = vW / cRatio;
    sY = (vH - sH) / 2;
  }

  octx.drawImage(bgVideo, sX, sY, sW, sH, 0, 0, cW, cH);
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.filter = "none";

  // Overlay Filters
  const filter = FILTERS[currentFilterKey];
  if (filter.overlay !== 'transparent') {
    octx.fillStyle = filter.overlay;
    octx.fillRect(0, 0, cW, cH);
  }
  if (filter.vignette) {
    const v = octx.createRadialGradient(cW/2, cH/2, cW/4, cW/2, cH/2, Math.max(cW, cH));
    v.addColorStop(0, "rgba(0,0,0,0)");
    v.addColorStop(1, "rgba(0,0,0,0.6)");
    octx.fillStyle = v;
    octx.fillRect(0, 0, cW, cH);
  }

  // Draw Event Text directly onto the exported high-res image
  if (EVENT_NAME || EVENT_DATE) {
    octx.textAlign = "center";
    octx.fillStyle = "white";
    octx.shadowColor = "rgba(0,0,0,0.5)";
    octx.shadowBlur = 15;
    octx.shadowOffsetY = 4;
    
    // Position text cleanly near the bottom
    const textY = cH - 300; 
    
    if (EVENT_NAME) {
      octx.font = `800 60px -apple-system, BlinkMacSystemFont, sans-serif`;
      octx.fillText(EVENT_NAME.toUpperCase(), cW / 2, textY);
    }
    if (EVENT_DATE) {
      octx.font = `500 28px -apple-system, BlinkMacSystemFont, sans-serif`;
      octx.fillText(EVENT_DATE.toUpperCase(), cW / 2, textY + 50);
    }
  }
}

/* ================= UPLOAD & RETAKE ================= */
retakeBtn.onclick = () => {
  uploadWrapper.classList.add("hidden");
  document.getElementById("statusMessage").classList.add("hidden");
  previewImage.classList.add("hidden");
  
  mainControls.classList.remove("hidden");
  
  shutterBtn.disabled = false;
  mainControls.style.opacity = "1";
  mainControls.style.pointerEvents = "none"; // Parent wrapper pointer events (allows clicks to pass)
};

uploadBtn.onclick = async () => {
  uploadBtn.disabled = true;
  retakeBtn.disabled = true;
  const statusMessage = document.getElementById("statusMessage");
  statusMessage.className = "loading";
  statusMessage.textContent = "Processing gallery upload...";
  statusMessage.classList.remove("hidden");

  try {
    const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.9));
    const base64 = await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = () => res(reader.result.split(",")[1]);
      reader.onerror = rej;
      reader.readAsDataURL(blob);
    });

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 35000); 

    const res = await fetch(UPLOAD_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      signal: controller.signal,
      body: JSON.stringify({
        file: base64,
        filename: `snapback_${Date.now()}.jpg`,
        mimeType: "image/jpeg"
      })
    });
    
    clearTimeout(timeout);
    if (!res.ok) throw new Error("Server error");
    await res.text();

    statusMessage.className = "success";
    statusMessage.textContent = "Upload complete.";
    uploadControls.classList.add("hidden");

    setTimeout(() => {
      retakeBtn.onclick(); 
      uploadBtn.disabled = false;
      retakeBtn.disabled = false;
      uploadControls.classList.remove("hidden");
    }, 2500);

  } catch (err) {
    statusMessage.className = "error";
    statusMessage.textContent = "Upload failed. Please check connection.";
    uploadBtn.disabled = false;
    retakeBtn.disabled = false;
  }
};

/* Start up */
initUI();
</script>
